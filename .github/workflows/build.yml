name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Plain actions/cache instead of the proprietary enhanced cache that is the v6 default.
          cache-provider: basic
      # The Swing integration tests skip themselves without a display, so run under Xvfb.
      - name: Test
        run: xvfb-run --auto-servernum ./gradlew test --no-daemon
      - name: Check that the tests ran
        run: |
          count=$(grep -ho 'tests="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          skipped=$(grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "Tests run: $count, skipped: $skipped"
          test "$count" -ge 100
          test "$skipped" -eq 0
      - name: Package
        run: ./gradlew jar deb --no-daemon
      - name: Check the fat jar and the package
        run: |
          jar=$(ls build/libs/amade-writepad-*.jar)
          unzip -l "$jar" icons/amade-writepad.png
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q 'Main-Class: eu.amadeos.apps.writepad'
          deb=$(ls build/distributions/amade-writepad_*_all.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" > contents.txt
          for f in opt/amade-writepad/amade-writepad.jar usr/bin/amade-writepad \
                   usr/share/applications/amade-writepad.desktop \
                   usr/share/icons/hicolor/48x48/apps/amade-writepad.png usr/share/doc/amade-writepad/copyright; do
            grep -q "$f" contents.txt || { echo "missing in the package: $f"; exit 1; }
          done
      - name: Upload the Debian package
        uses: actions/upload-artifact@v7
        with:
          name: amade-writepad-deb
          path: build/distributions/*.deb
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # jpackage needs the WiX Toolset for MSI; CI installs WiX 3 (JDK 25 also takes WiX 4/5).
      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $bin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $bin) {
              choco install wixtoolset --no-progress -y
              $bin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin' -Directory | Select-Object -First 1
            }
            $bin.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      # Not required yet: the tests have only been run on Linux so far. Make this step required
      # (remove continue-on-error) once it passes.
      - name: Test on Windows
        id: windows-tests
        continue-on-error: true
        run: ./gradlew test --no-daemon
      - name: Build the MSI
        run: ./gradlew windowsInstaller --no-daemon
      - name: Build the portable app image
        run: ./gradlew windowsInstaller -PinstallerType=app-image --no-daemon
      - name: Check and pack the results
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/windows/msi/*.msi
          if ($msi.Count -ne 1) { throw "Expected one MSI, found $($msi.Count)" }
          if ($msi.Length -lt 30MB) { throw "MSI is too small to contain a Java runtime: $($msi.Length) bytes" }
          if (-not (Test-Path build/windows/app-image/amade-writepad/amade-writepad.exe)) { throw 'amade-writepad.exe missing' }
          Compress-Archive -Path build/windows/app-image/amade-writepad -DestinationPath build/windows/amade-writepad-portable.zip
          Write-Host "MSI: $($msi.Name), $([math]::Round($msi.Length / 1MB)) MB"
      - name: Upload the Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: amade-writepad-windows
          path: |
            build/windows/msi/*.msi
            build/windows/amade-writepad-portable.zip
          if-no-files-found: error
      - name: Upload test reports
        if: failure() || steps.windows-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: build/reports/tests/test
